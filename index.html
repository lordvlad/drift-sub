<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a3a55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drift">
<title>Drift — a quiet submarine</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06222f; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; color: #dff6ff; touch-action: none; overscroll-behavior: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 16px; top: 14px; font-size: 13px; letter-spacing: .06em; opacity: .65; pointer-events: none; text-shadow: 0 1px 6px #0008; line-height: 1.5; font-variant-numeric: tabular-nums; }
  #tools { position: fixed; right: 12px; top: 12px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: min(640px, calc(100vw - 150px)); z-index: 5; }
  #tools button, .pad { font: inherit; font-size: 12px; color: #dff6ff; background: #0b2f4466; border: 1px solid #9fe3ff44; border-radius: 999px; padding: 7px 13px; backdrop-filter: blur(6px); cursor: pointer; }
  #tools button:hover { background: #0b2f4499; }
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; background: radial-gradient(ellipse at 50% 40%, #0e5b7acc, #04141fee); z-index: 10; transition: opacity 1.2s ease; padding: 24px; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 { font-weight: 300; font-size: clamp(34px, 7vw, 64px); letter-spacing: .3em; margin: 0 0 0 .3em; }
  #intro p { margin: 0; opacity: .8; font-size: 14px; line-height: 1.8; max-width: 520px; }
  #intro kbd { background: #ffffff1a; border: 1px solid #ffffff33; border-radius: 5px; padding: 1px 7px; font: inherit; font-size: 12px; }
  #go { margin-top: 10px; font: inherit; font-size: 16px; letter-spacing: .2em; color: #06222f; background: #ffd21f; border: 0; border-radius: 999px; padding: 13px 38px; cursor: pointer; box-shadow: 0 8px 30px #ffd21f44; }
  #go:disabled { opacity: .5; cursor: default; }
  #touchui { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; }
  body.touch #touchui { display: block; }
  #joy { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); width: 68px; height: 172px; border-radius: 34px; background: #0b2f4455; border: 1px solid #9fe3ff55; pointer-events: auto; touch-action: none; display: grid; place-items: center; backdrop-filter: blur(4px); }
  #joy::before, #joy::after { position: absolute; left: 0; right: 0; text-align: center; font-size: 18px; opacity: .55; pointer-events: none; }
  #joy::before { content: '+'; top: 6px; } #joy::after { content: '\2212'; bottom: 6px; }
  #knob { width: 52px; height: 52px; border-radius: 50%; background: #ffd21fcc; box-shadow: 0 4px 16px #0006; pointer-events: none; }
  .vbtn { position: absolute; right: max(22px, env(safe-area-inset-right)); width: 64px; height: 64px; border-radius: 50%; background: #0b2f4466; border: 1px solid #9fe3ff55; color: #dff6ff; font-size: 22px; display: grid; place-items: center; pointer-events: auto; touch-action: none; backdrop-filter: blur(4px); }
  .vbtn.on { background: #ffd21f99; }
  #btnUp { bottom: calc(max(26px, env(safe-area-inset-bottom)) + 76px); }
  #btnDown { bottom: max(26px, env(safe-area-inset-bottom)); }
  #gauge { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); z-index: 3; pointer-events: none; font-size: 11px; letter-spacing: .04em; text-shadow: 0 1px 6px #0008; color: #dff6ff; --c: #dff6ff; transition: color .4s; }
  #gauge.red { --c: #ff5d4d; color: #ff5d4d; }
  #gauge.red #gMark { animation: gpulse 1s ease-in-out infinite; }
  @keyframes gpulse { 50% { opacity: .55; } }
  #gHead { opacity: .85; margin-bottom: 2px; } #gHead b { font-size: 13px; }
  #gLim { opacity: .6; margin-bottom: 8px; font-size: 10px; }
  #gRule { position: relative; width: 110px; height: min(46vh, 340px); border-left: 4px solid var(--c); border-top: 4px solid var(--c); border-bottom: 4px solid var(--c); border-radius: 2px 0 0 2px; opacity: .9; transition: border-color .4s; }
  #gTicks { position: absolute; inset: 0; }
  #gTicks div { position: absolute; left: 0; height: 0; width: 14px; border-top: 2px solid var(--c); }
  #gTicks div.maj { width: 24px; }
  #gTicks span { position: absolute; left: 32px; top: -7px; font-size: 11px; }
  #gDanger { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#ff3b2e00, #ff3b2e55); border-left: 0; }
  #gMark { position: absolute; left: -4px; width: 100%; height: 0; border-top: 2px solid var(--c); }
  #gMark i { position: absolute; left: -9px; top: -6px; border: 5px solid transparent; border-left: 8px solid var(--c); }
  #gVal { position: absolute; left: 36px; top: -11px; font-size: 16px; font-weight: 700; white-space: nowrap; background: #0a3a55aa; border-radius: 6px; padding: 0 6px; }
  body.touch #gauge { top: 36%; transform: translateY(-50%) scale(.7); transform-origin: left center; }
  .ib { position: relative; width: 40px; height: 40px; padding: 0 !important; border-radius: 50% !important; display: inline-grid; place-items: center; line-height: 0; }
  .ib svg { display: block; }
  #vfBar .ib { width: 46px; height: 46px; } #album button.ib { width: 40px; height: 40px; }
  #album button.ib.primary { background: #ffd21f; color: #06222f; }
  body.touch .ib { width: 44px; height: 44px; }
  #fsBanner { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 16px; font-size: 13px; background: #0b2f44cc; border: 1px solid #9fe3ff44; border-radius: 999px; backdrop-filter: blur(6px); animation: fsIn .8s ease both; }
  #fsBanner[hidden] { display: none; }
  #fsBanner button { font: inherit; font-size: 12px; color: #dff6ff; background: #ffffff1a; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  #fsBanner #fsGo { background: #ffd21f; color: #06222f; }
  @keyframes fsIn { from { opacity: 0; transform: translate(-50%, 10px); } }
  body.touch #fsBanner { bottom: 18px; }
  #snapBtn { position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%; z-index: 5; display: grid; place-items: center; color: #dff6ff; background: #0b2f4466; border: 1px solid #9fe3ff66; backdrop-filter: blur(4px); cursor: pointer; padding: 0; }
  #snapBtn:active { background: #ffd21f99; }
  body.touch #snapBtn { right: calc(max(22px, env(safe-area-inset-right)) + 80px); bottom: max(26px, env(safe-area-inset-bottom)); width: 64px; height: 64px; }
  body.vf #tools, body.vf #hud, body.vf #gauge, body.vf #snapBtn, body.vf #fsBanner { display: none !important; }
  body.vf #hint { bottom: auto; top: 20%; z-index: 7; }
  body.vf #touchui { display: none !important; }
  #hurt { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, #ff1e1400 42%, #ff1e1433 70%, #e0140acc 100%); }
  #vfCracks { position: absolute; inset: 0; width: 100%; height: 100%; }
  #vf { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #vf[hidden] { display: none; }
  #vfFrame { position: absolute; inset: 4.5%; }
  #vfFrame .c { position: absolute; width: 34px; height: 34px; border: 0 solid #ffffffcc; }
  .tl { left: 0; top: 0; border-left-width: 3px !important; border-top-width: 3px !important; } .tr { right: 0; top: 0; border-right-width: 3px !important; border-top-width: 3px !important; }
  .bl { left: 0; bottom: 0; border-left-width: 3px !important; border-bottom-width: 3px !important; } .br { right: 0; bottom: 0; border-right-width: 3px !important; border-bottom-width: 3px !important; }
  #vfFrame .g { position: absolute; background: #ffffff26; } .gv1 { left: 33.3%; top: 0; bottom: 0; width: 1px; } .gv2 { left: 66.6%; top: 0; bottom: 0; width: 1px; }
  .gh1 { top: 33.3%; left: 0; right: 0; height: 1px; } .gh2 { top: 66.6%; left: 0; right: 0; height: 1px; }
  #vfCross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 1px solid #ffffffaa; border-radius: 50%; }
  #vfTop { position: absolute; top: calc(4.5% + 10px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; letter-spacing: .08em; text-shadow: 0 1px 6px #000a; }
  #vfHint { opacity: .65; }
  #vfBar { position: absolute; left: 0; right: 0; bottom: calc(4.5% + 6px); display: flex; justify-content: center; align-items: center; gap: 22px; }
  #vfBar button { pointer-events: auto; font: inherit; font-size: 13px; color: #dff6ff; background: #0b2f4488; border: 1px solid #9fe3ff55; border-radius: 999px; padding: 9px 16px; cursor: pointer; backdrop-filter: blur(4px); }
  #shutter { width: 70px; height: 70px; padding: 0 !important; border-radius: 50% !important; border: 4px solid #fff !important; background: #ffffff22 !important; display: grid; place-items: center; }
  #shutter i { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: block; transition: transform .1s; } #shutter:active i { transform: scale(.82); }
  @media (max-width: 520px) { #vfBar { gap: 8px; } #vfBar button { padding: 8px 11px; font-size: 12px; } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  #flash.go { animation: flash .45s ease-out; }
  @keyframes flash { from { opacity: .75; } to { opacity: 0; } }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 7px 16px; font-size: 13px; background: #0b2f44dd; border: 1px solid #9fe3ff44; border-radius: 999px; opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 8; }
  #toast.show { opacity: 1; }
  #album { position: fixed; inset: 0; z-index: 20; background: #031420ee; backdrop-filter: blur(8px); display: flex; flex-direction: column; touch-action: auto; }
  #album[hidden], #albumView[hidden] { display: none; }
  #albumBar, #viewBar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-size: 14px; }
  .sp { flex: 1; }
  #album button { font: inherit; font-size: 13px; color: #dff6ff; background: #ffffff1a; border: 1px solid #9fe3ff33; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  #album button.primary { background: #ffd21f; color: #06222f; border: 0; }
  #albumGrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 4px 16px 20px; align-content: start; touch-action: pan-y; }
  .thumb { aspect-ratio: 16 / 10; background-size: cover; background-position: center; border-radius: 10px !important; border: 1px solid #9fe3ff33 !important; padding: 0 !important; }
  #albumEmpty { display: none; margin: auto; opacity: .7; }
  #album.empty #albumEmpty { display: block; }
  #albumView { position: absolute; inset: 0; background: #020d16; display: flex; flex-direction: column; }
  #viewMain { flex: 1; min-height: 0; display: flex; }
  #albumImg { flex: 1; min-width: 0; min-height: 0; object-fit: contain; }
  #albumCoins { color: #ffd21f; font-size: 13px; }
  .thumb { position: relative; }
  @media (max-width: 640px) {  }
  #viewBar { flex-wrap: wrap; }
  #albumCap { opacity: .7; font-size: 12px; }
  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 13px; opacity: 0; transition: opacity 2s; pointer-events: none; text-shadow: 0 1px 6px #000a; letter-spacing: .05em; text-align: center; }
  #hint.show { opacity: .75; }
  body.touch #hint { bottom: auto; top: 54px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"><div id="speed"></div></div>
<div id="gauge"><div id="gHead">Units below sea level: <b id="gNow">0m</b></div><div id="gLim">Max dive depth <span id="gMax"></span></div>
  <div id="gRule"><div id="gDanger"></div><div id="gTicks"></div><div id="gMark"><span id="gVal"></span><i></i></div></div></div>
<div id="tools"><button id="modeBtn" title="Switch between touch / keyboard+mouse controls"></button><button id="albumBtn" title="Snapshot album"></button><button id="timeBtn" title="Time of day (auto = your clock)"></button><button id="lampBtn" title="Headlights (F)"></button><button id="waveBtn" title="Sea state"></button><button id="soundBtn"></button></div>
<div id="touchui"><div id="joy"><div id="knob"></div></div><div class="vbtn" id="btnUp">▲</div><div class="vbtn" id="btnDown">▼</div></div>
<div id="fsBanner" hidden><span>Fullscreen is more immersive.</span><button id="fsGo">Go fullscreen</button><button id="fsX" aria-label="Dismiss">✕</button></div>
<button id="snapBtn" title="Take snapshot (P)" aria-label="Take snapshot"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></button>
<div id="hurt"></div>
<div id="vf" hidden>
  <canvas id="vfCracks"></canvas>
  <div id="vfFrame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><i class="g gv1"></i><i class="g gv2"></i><i class="g gh1"></i><i class="g gh2"></i><i id="vfCross"></i></div>
  <div id="vfTop"><span id="vfDepth"></span><span id="vfHint"></span></div>
  <div id="vfBar"><button id="vfAlbum"></button><button id="vfLamp"></button><button id="shutter" aria-label="Take photo"><i></i></button><button id="vfExit"></button></div>
</div>
<div id="flash"></div><div id="toast"></div>
<div id="album" hidden>
  <div id="albumBar"><b>Album</b><span id="albumCount"></span><span id="albumCoins"></span><span class="sp"></span><button id="albumClose"></button></div>
  <div id="albumGrid"></div><div id="albumEmpty">No snapshots yet — press <kbd>P</kbd> or the camera button.</div>
  <div id="albumView" hidden><div id="viewMain"><img id="albumImg" alt="snapshot"></div><div id="viewBar"><button id="viewPrev" aria-label="Older"></button><span id="albumCap"></span><button id="viewNext" aria-label="Newer"></button><span class="sp"></span><button id="viewSell" class="primary"></button><button id="viewDl"></button><button id="viewDel"></button><button id="viewClose"></button></div></div>
</div>
<div id="hint"></div>
<div id="intro">
  <h1>DRIFT</h1>
  <p id="introText"></p>
  <button id="go" disabled>Loading…</button>
</div>
<script src="main.js" type="module"></script>
</body>
</html>
